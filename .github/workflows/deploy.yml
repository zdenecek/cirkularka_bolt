name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list = show remote files, dry-run = show what would upload, deploy = upload"
        type: choice
        options: [list, dry-run, deploy]
        default: list

jobs:
  list:
    if: inputs.mode == 'list'
    runs-on: ubuntu-latest
    steps:
      - name: List remote directory
        env:
          FTP: ${{ secrets.FTP_LOGIN }},${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '.' }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP" "${{ secrets.FTP_SERVER }}" -e "set ftp:ssl-allow yes; cd $FTP_SERVER_DIR; ls -la; ls -la public; ls -la var; bye"

  deploy:
    if: inputs.mode != 'list'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Install dependencies
        env:
          APP_ENV: prod
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Clear old cache on server
        if: inputs.mode == 'deploy'
        env:
          FTP: ${{ secrets.FTP_LOGIN }},${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '.' }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$FTP" "${{ secrets.FTP_SERVER }}" -e "set ftp:ssl-allow yes; set cmd:fail-exit no; cd $FTP_SERVER_DIR; mv var/cache var/cache-old-$GITHUB_RUN_ID; mkdir var/cache; bye"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_LOGIN }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          dry-run: ${{ inputs.mode == 'dry-run' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .env
            .env.*
            **/.htaccess
            var/**
            public/files/**
            public/thumbs/**
            tests/**
            docker/**
